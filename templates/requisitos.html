{% extends "base.html" %}

{% block content %}
<div class="mb-6">
    <h1 class="text-3xl font-bold mb-2">Requisitos de Conclusão</h1>
</div>

<div class="card bg-base-100 shadow-md mb-6">
    <div class="card-body">
        <h2 class="card-title">Progresso Geral</h2>
        <div class="flex items-center gap-4 mt-2">
            <div id="progress-radial" class="radial-progress text-primary" style="--value:0; --size:5rem; --thickness:0.5rem;" role="progressbar">
                <span id="progress-percent">-</span>
            </div>
            <div>
                <p class="text-sm font-bold opacity-70">Total Integralizado</p>
                <p id="progress-totals" class="text-xl">
                    <span class="skeleton h-6 w-40 inline-block"></span>
                </p>
            </div>
        </div>
        <progress id="progress-bar" class="progress progress-primary w-full mt-4" value="0" max="100"></progress>
    </div>
</div>

<div id="requisitos-grid" class="grid grid-cols-1 md:grid-cols-2 gap-4">
    {% for _ in range(4) %}
    <div class="card bg-base-100 shadow-md">
        <div class="card-body py-4">
            <span class="skeleton h-5 w-2/3 inline-block"></span>
            <span class="skeleton h-3 w-full inline-block mt-3"></span>
            <span class="skeleton h-3 w-1/2 inline-block mt-1"></span>
        </div>
    </div>
    {% endfor %}
</div>
{% endblock %}

{% block page_scripts %}
<script src="/static/js/requisitos.js"></script>
{% endblock %}
