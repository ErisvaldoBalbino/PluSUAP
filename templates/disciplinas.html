{% extends "base.html" %}

{% block content %}
<div class="w-full flex flex-wrap justify-between items-center gap-3 mb-6">
    <h1 class="text-3xl font-bold">Minhas Disciplinas</h1>
</div>

<div id="disciplinas-list" class="grid grid-cols-1 md:grid-cols-2 gap-4">
    {% for _ in range(4) %}
    <div class="card bg-base-100 shadow-md">
        <div class="card-body">
            <span class="skeleton h-6 w-3/4 inline-block"></span>
            <span class="skeleton h-4 w-1/2 inline-block mt-2"></span>
            <span class="skeleton h-4 w-1/3 inline-block mt-1"></span>
        </div>
    </div>
    {% endfor %}
</div>

<dialog id="etapas-modal" class="modal">
    <div class="modal-box w-11/12 max-w-2xl">
        <form method="dialog">
            <button class="btn btn-sm btn-circle btn-ghost absolute right-2 top-2">✕</button>
        </form>
        <h3 id="etapas-modal-title" class="font-bold text-lg mb-4">Etapas</h3>
        <div id="etapas-modal-body">
            <span class="loading loading-spinner loading-md"></span>
        </div>
    </div>
    <form method="dialog" class="modal-backdrop">
        <button>close</button>
    </form>
</dialog>
{% endblock %}

{% block page_scripts %}
<script src="/static/js/disciplinas.js"></script>
{% endblock %}
