<!DOCTYPE html>
<html lang="pt-BR" data-theme="plus">

<head>
    <script src="/static/js/theme.js"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PluSUAP - {{ title }}</title>
    <link href="https://cdn.jsdelivr.net/npm/daisyui@4.10.1/dist/full.min.css" rel="stylesheet" type="text/css" />
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="/static/css/style.css" rel="stylesheet" type="text/css" />
</head>

<body class="bg-base-200 text-base-content min-h-screen overflow-x-hidden antialiased flex flex-col pb-24 lg:pb-0">
    <!-- Main Shell Container -->
    <div class="flex h-screen w-full overflow-hidden relative">
        
        <!-- Desktop Fixed Sidebar (Hidden on mobile) -->
        <aside id="sidebar" class="hidden lg:flex flex-shrink-0 flex-col overflow-hidden">
            <div class="sidebar-brand shrink-0">
                <div class="sidebar-logo">P</div>
                <div>
                    <div class="font-extrabold text-xl leading-tight bg-gradient-to-r from-primary to-accent bg-clip-text text-transparent">PluSUAP</div>
                    <div class="text-[10px] uppercase font-bold tracking-widest text-base-content/40">Portal Acadêmico</div>
                </div>
            </div>

            <!-- Period Selector inside Sidebar -->
            <div class="px-4 py-2.5 border-b border-base-300/30 shrink-0 mb-2">
                <div class="flex flex-col gap-1.5">
                    <span class="text-[9px] uppercase font-black tracking-widest text-base-content/40 pl-1">Período Letivo</span>
                    <select class="period-select-dropdown select select-bordered select-sm w-full font-bold rounded-lg bg-base-100 border-base-300/60 text-xs pl-3.5 pr-8" disabled>
                        <option selected>Buscando semestres...</option>
                    </select>
                </div>
            </div>

            <!-- Navigation Menu -->
            <ul class="menu p-0 flex-1 overflow-y-auto min-h-0 space-y-1">
                <li class="nav-link {% if request.url.path == '/' %}nav-link-active{% endif %}">
                    <a href="/" class="flex items-center gap-3">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 stroke-current" fill="none" viewBox="0 0 24 24" stroke-width="2">
                            <path stroke-linecap="round" stroke-linejoin="round" d="M2.25 12l8.954-8.955a1.126 1.126 0 011.591 0L21.75 12M4.5 9.75v10.125c0 .621.504 1.125 1.125 1.125H9.75v-4.875c0-.621.504-1.125 1.125-1.125h2.25c.621 0 1.125.504 1.125 1.125V21h4.125c.621 0 1.125-.504 1.125-1.125V9.75M8.25 21h8.25" />
                        </svg>
                        Início
                    </a>
                </li>
                <li class="nav-link {% if request.url.path == '/disciplinas' %}nav-link-active{% endif %}">
                    <a href="/disciplinas" class="flex items-center gap-3">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 stroke-current" fill="none" viewBox="0 0 24 24" stroke-width="2">
                            <path stroke-linecap="round" stroke-linejoin="round" d="M12 6.042A8.967 8.967 0 006 3.75c-1.052 0-2.062.18-3 .512v14.25A8.987 8.987 0 016 18c2.305 0 4.408.867 6 2.292m0-14.25a8.966 8.966 0 016-2.292c1.052 0 2.062.18 3 .512v14.25A8.987 8.987 0 0018 18a8.967 8.967 0 00-6 2.292m0-14.25v14.25" />
                        </svg>
                        Minhas Disciplinas
                    </a>
                </li>
                <li class="nav-link {% if request.url.path == '/simulador' %}nav-link-active{% endif %}">
                    <a href="/simulador" class="flex items-center gap-3">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 stroke-current" fill="none" viewBox="0 0 24 24" stroke-width="2">
                            <path stroke-linecap="round" stroke-linejoin="round" d="M3.75 3v11.25A2.25 2.25 0 006 16.5h2.25M3.75 3h-1.5m1.5 0h16.5m0 0h1.5m-1.5 0v11.25A2.25 2.25 0 0118 16.5h-2.25m-7.5 0h7.5m-7.5 0l-1 3m8.5-3l1 3m0 0l.5 1.5m-.5-1.5h-9.5m0 0l-.5 1.5m.75-9l3-3 2.148 2.148A12.061 12.061 0 0116.5 7.605" />
                        </svg>
                        Simulador
                    </a>
                </li>
                <li class="nav-link {% if request.url.path == '/requisitos' %}nav-link-active{% endif %}">
                    <a href="/requisitos" class="flex items-center gap-3">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 stroke-current" fill="none" viewBox="0 0 24 24" stroke-width="2">
                            <path stroke-linecap="round" stroke-linejoin="round" d="M9 12.75L11.25 15 15 9.75M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
                        </svg>
                        Requisitos
                    </a>
                </li>
                <li class="nav-link {% if request.url.path == '/faltas' %}nav-link-active{% endif %}">
                    <a href="/faltas" class="flex items-center gap-3">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 stroke-current" fill="none" viewBox="0 0 24 24" stroke-width="2">
                            <path stroke-linecap="round" stroke-linejoin="round" d="M6.75 3v2.25M17.25 3v2.25M3 18.75V7.5a2.25 2.25 0 012.25-2.25h13.5A2.25 2.25 0 0121 7.5v11.25m-18 0A2.25 2.25 0 005.25 21h13.5A2.25 2.25 0 0021 18.75m-18 0v-7.5A2.25 2.25 0 015.25 9h13.5A2.25 2.25 0 0121 11.25v7.5m-9-6h.008v.008H12v-.008zM12 15h.008v.008H12V15zm0 2.25h.008v.008H12v-.008zM9.75 15h.008v.008H9.75V15zm0 2.25h.008v.008H9.75v-.008zM7.5 15h.008v.008H7.5V15zm0 2.25h.008v.008H7.5v-.008zm6.75-4.5h.008v.008h-.008v-.008zm0 2.25h.008v.008h-.008V15zm0 2.25h.008v.008h-.008v-.008zm2.25-4.5h.008v.008H16.5v-.008zm0 2.25h.008v.008H16.5V15z" />
                        </svg>
                        Faltas
                    </a>
                </li>
            </ul>

            <!-- Theme Toggle and Logout inside Sidebar Footer -->
            <div class="border-t border-base-300/40 px-4 py-3 shrink-0 space-y-2">
                <label class="flex items-center justify-between cursor-pointer gap-3 px-3 py-2 rounded-lg hover:bg-base-content/5 transition text-sm font-semibold">
                    <span class="flex items-center gap-2 text-base-content/75">
                        <svg class="w-4 h-4 fill-current text-base-content/50" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
                            <path d="M21.64,13a1,1,0,0,0-1.05-.14,8.05,8.05,0,0,1-3.37.73A8.15,8.15,0,0,1,9.08,5.49a8.59,8.59,0,0,1,.25-2A1,1,0,0,0,8,2.36,10.14,10.14,0,1,0,22,14.05,1,1,0,0,0,21.64,13Zm-9.5,6.69A8.14,8.14,0,0,1,7.08,5.22v.27A10.15,10.15,0,0,0,17.22,15.63a9.79,9.79,0,0,0,2.1-.22A8.11,8.11,0,0,1,12.14,19.73Z"/>
                        </svg>
                        Tema Escuro
                    </span>
                    <input type="checkbox" id="themeToggle" class="toggle toggle-sm toggle-primary" />
                </label>
                
                <a href="/logout" class="flex items-center gap-3 px-3 py-2 text-sm font-bold text-error/70 hover:text-error hover:bg-error/10 transition rounded-lg">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M15.75 9V5.25A2.25 2.25 0 0013.5 3h-6a2.25 2.25 0 00-2.25 2.25v13.5A2.25 2.25 0 007.5 21h6a2.25 2.25 0 002.25-2.25V15m3 0l3-3m0 0l-3-3m3 3H9" />
                    </svg>
                    Sair
                </a>
            </div>
        </aside>

        <!-- Mobile Bottom Floating Navigation (Visible only on mobile/tablet) -->
        <nav class="mobile-bottom-nav lg:hidden">
            <a href="/" class="mobile-nav-btn {% if request.url.path == '/' %}active{% endif %}">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M2.25 12l8.954-8.955a1.126 1.126 0 011.591 0L21.75 12M4.5 9.75v10.125c0 .621.504 1.125 1.125 1.125H9.75v-4.875c0-.621.504-1.125 1.125-1.125h2.25c.621 0 1.125.504 1.125 1.125V21h4.125c.621 0 1.125-.504 1.125-1.125V9.75M8.25 21h8.25" />
                </svg>
                <span>Início</span>
            </a>
            <a href="/disciplinas" class="mobile-nav-btn {% if request.url.path == '/disciplinas' %}active{% endif %}">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M12 6.042A8.967 8.967 0 006 3.75c-1.052 0-2.062.18-3 .512v14.25A8.987 8.987 0 016 18c2.305 0 4.408.867 6 2.292m0-14.25a8.966 8.966 0 016-2.292c1.052 0 2.062.18 3 .512v14.25A8.987 8.987 0 0018 18a8.967 8.967 0 00-6 2.292m0-14.25v14.25" />
                </svg>
                <span>Aulas</span>
            </a>
            <a href="/simulador" class="mobile-nav-btn {% if request.url.path == '/simulador' %}active{% endif %}">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M9 7.07l2.28 2.28 5.72-5.72M3.75 3v11.25A2.25 2.25 0 006 16.5h2.25M3.75 3h-1.5m1.5 0h16.5m0 0h1.5m-1.5 0v11.25A2.25 2.25 0 0118 16.5h-2.25" />
                </svg>
                <span>Simular</span>
            </a>
            <a href="/faltas" class="mobile-nav-btn {% if request.url.path == '/faltas' %}active{% endif %}">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z" />
                </svg>
                <span>Faltas</span>
            </a>
            <a href="/requisitos" class="mobile-nav-btn {% if request.url.path == '/requisitos' %}active{% endif %}">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M9 12.75L11.25 15 15 9.75M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
                </svg>
                <span>Progresso</span>
            </a>
        </nav>

        <!-- Main Content Area Wrapper -->
        <div class="flex-1 flex flex-col min-w-0 h-full overflow-hidden">
            
            <!-- Sleek Top Header Bar -->
            <header class="sticky top-0 z-40 bg-base-200/60 backdrop-blur-lg border-b lg:hidden border-base-300/40 px-4 md:px-8 py-3.5 flex items-center justify-between">
                <div class="flex items-center gap-3">
                    <!-- Brand Icon on Mobile only -->
                    <div class="sidebar-logo">P</div>
                    <span class="text-[10px] font-bold uppercase tracking-wider text-base-content/40 hidden md:inline-block">
                        Período Letivo
                    </span>
                    <!-- Period Select Dropdown -->
                    <div class="relative shrink-0">
                        <select class="period-select-dropdown select select-bordered select-sm max-w-[200px] md:max-w-xs font-semibold rounded-lg bg-base-100/50 border-base-300/60 text-xs md:text-sm pl-3 pr-8" disabled>
                            <option selected>Buscando semestres...</option>
                        </select>
                    </div>
                </div>

                <!-- Theme / Info Panel inside Header (Mobile accessibility) -->
                <div class="flex items-center gap-2">
                    <label class="lg:hidden flex btn btn-circle btn-ghost btn-sm">
                        <input type="checkbox" id="themeToggleMobile" class="hidden" />
                        <!-- Moon SVG -->
                        <svg id="themeMoonIcon" class="w-4 h-4 fill-current text-base-content/60" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
                            <path d="M21.64,13a1,1,0,0,0-1.05-.14,8.05,8.05,0,0,1-3.37.73A8.15,8.15,0,0,1,9.08,5.49a8.59,8.59,0,0,1,.25-2A1,1,0,0,0,8,2.36,10.14,10.14,0,1,0,22,14.05,1,1,0,0,0,21.64,13Zm-9.5,6.69A8.14,8.14,0,0,1,7.08,5.22v.27A10.15,10.15,0,0,0,17.22,15.63a9.79,9.79,0,0,0,2.1-.22A8.11,8.11,0,0,1,12.14,19.73Z"/>
                        </svg>
                    </label>
                    <a href="/logout" class="lg:hidden btn btn-ghost btn-circle btn-sm text-error/80" aria-label="logout">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-4.5 w-4.5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                            <path stroke-linecap="round" stroke-linejoin="round" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1" />
                        </svg>
                    </a>
                </div>
            </header>

            <!-- Main Content Container with Scroll -->
            <main class="flex-1 min-h-0 overflow-y-auto overflow-x-hidden p-4 md:p-8 animate-fade-in">
                <div class="max-w-7xl mx-auto pb-12">
                    {% block content %}{% endblock %}
                </div>
            </main>
        </div>
    </div>

    <!-- Mobile Theme sync script -->
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const toggleDesktop = document.getElementById('themeToggle');
            const toggleMobile = document.getElementById('themeToggleMobile');
            
            function syncThemes(isDark) {
                const newTheme = isDark ? 'plus-dark' : 'plus';
                document.documentElement.setAttribute('data-theme', newTheme);
                localStorage.setItem('theme', newTheme);
                
                if (toggleDesktop) toggleDesktop.checked = isDark;
                if (toggleMobile) {
                    const icon = document.getElementById('themeMoonIcon');
                    if (isDark) {
                        icon.classList.add('text-primary');
                    } else {
                        icon.classList.remove('text-primary');
                    }
                }
            }

            if (toggleDesktop) {
                toggleDesktop.addEventListener('change', (e) => syncThemes(e.target.checked));
            }
            if (toggleMobile) {
                toggleMobile.addEventListener('click', () => {
                    const currentTheme = document.documentElement.getAttribute('data-theme');
                    const targetDark = currentTheme !== 'plus-dark';
                    syncThemes(targetDark);
                });
                
                // Init mobile icon color state
                const isDark = document.documentElement.getAttribute('data-theme') === 'plus-dark';
                const icon = document.getElementById('themeMoonIcon');
                if (isDark && icon) icon.classList.add('text-primary');
            }
        });
    </script>

    <script src="/static/js/auth.js"></script>
    <script src="/static/js/period-selector.js"></script>
    {% block page_scripts %}{% endblock %}
</body>

</html>
