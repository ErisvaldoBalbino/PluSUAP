{% extends "base.html" %}

{% block content %}
<div class="flex justify-between items-center mb-6">
    <h1 class="text-3xl font-bold">Relatório</h1>
    <a href="/exportar/pdf" class="btn btn-outline btn-error border-opacity-50 hover:text-white">Exportar PDF</a>
</div>

<div class="card bg-base-100 shadow-md">
    <div class="card-body">
        <div class="overflow-x-auto">
            <table class="table w-full">
                <thead>
                    <tr>
                        <th>Disciplina</th>
                        <th>Notas (Ex: N1 / N2 / NF)</th>
                        <th>Frequência</th>
                        <th>Carga Horária</th>
                        <th>Situação Final</th>
                    </tr>
                </thead>
                <tbody id="report-grades-body">
                    {% for _ in range(5) %}
                    <tr>
                        <td><span class="skeleton h-4 w-56 inline-block"></span></td>
                        <td><span class="skeleton h-4 w-40 inline-block"></span></td>
                        <td><span class="skeleton h-4 w-24 inline-block"></span></td>
                        <td><span class="skeleton h-4 w-14 inline-block"></span></td>
                        <td><span class="skeleton h-6 w-24 inline-block"></span></td>
                    </tr>
                    {% endfor %}
                </tbody>
            </table>
        </div>
    </div>
</div>
{% endblock %}

{% block page_scripts %}
<script src="/static/js/relatorios.js"></script>
{% endblock %}
