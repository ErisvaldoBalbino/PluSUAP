{% extends "base.html" %}

{% block content %}
<div class="flex justify-between items-center mb-6">
    <h1 class="text-3xl font-bold">Relatório</h1>
    <div class="join">
        <a href="/exportar/pdf" class="btn btn-outline btn-error join-item border-opacity-50 hover:text-white">PDF</a>
        <a href="/exportar/csv" class="btn btn-outline btn-success join-item border-opacity-50 hover:text-white">CSV</a>
    </div>
</div>

<div class="card bg-base-100 shadow-md">
    <div class="card-body">
        <div class="overflow-x-auto">
            <table class="table w-full">
                <thead>
                    <tr>
                        <th>Disciplina</th>
                        <th>Notas (Ex: N1 / N2 / NF)</th>
                        <th>Frequência</th>
                        <th>Carga Horária</th>
                        <th>Situação Final</th>
                    </tr>
                </thead>
                <tbody>
                    <tr>
                        <td class="font-medium">Cálculo I</td>
                        <td>
                            <div class="flex gap-2 text-sm justify-center">
                                <span class="badge badge-lg">N1: 80</span>
                                <span class="badge badge-lg badge-outline border-base-content/20">-</span>
                            </div>
                        </td>
                        <td>95% (20/22 aulas)</td>
                        <td>80h</td>
                        <td>Em andamento</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>
{% endblock %}
