<!DOCTYPE html>
<html lang="pt-BR" data-theme="plus">
<head>
    <script src="/static/js/theme.js"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PluSUAP - {{ title }}</title>
    <link href="https://cdn.jsdelivr.net/npm/daisyui@4.10.1/dist/full.min.css" rel="stylesheet" type="text/css" />
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="/static/css/style.css" rel="stylesheet" type="text/css" />
    <style>
        .login-bg {
            background: linear-gradient(135deg, oklch(var(--b1)) 0%, oklch(var(--b2)) 100%);
            position: relative;
        }
        .login-bg::before {
            content: '';
            position: absolute;
            inset: 0;
            opacity: 0.03;
            background-image: linear-gradient(to right, oklch(var(--bc)) 1px, transparent 1px),
                              linear-gradient(to bottom, oklch(var(--bc)) 1px, transparent 1px);
            background-size: 24px 24px;
            pointer-events: none;
        }
        [data-theme="plus-dark"] .login-bg::before {
            opacity: 0.05;
        }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center login-bg relative overflow-hidden select-none">

<!-- Top-right theme selector -->
<div class="fixed top-4 right-4 z-50">
    <label class="flex items-center gap-2 cursor-pointer px-3 py-2 rounded-xl bg-base-100/30 backdrop-blur-md shadow-md border border-base-300/40">
        <svg class="w-4 h-4 fill-current text-base-content/60" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
            <path d="M5.64,17l-.71.71a1,1,0,0,0,0,1.41,1,1,0,0,0,1.41,0l.71-.71A1,1,0,0,0,5.64,17ZM5,12a1,1,0,0,0-1-1H3a1,1,0,0,0,0,2H4A1,1,0,0,0,5,12Zm7-7a1,1,0,0,0,1-1V3a1,1,0,0,0-2,0V4A1,1,0,0,0,12,5ZM5.64,7.05a1,1,0,0,0,.7.29,1,1,0,0,0,.71-.29,1,1,0,0,0,0-1.41l-.71-.71A1,1,0,0,0,4.93,6.34Zm12,.29a1,1,0,0,0,.7-.29l.71-.71a1,1,0,1,0-1.41-1.41L17,5.64a1,1,0,0,0,0,1.41A1,1,0,0,0,17.66,7.34ZM21,11H20a1,1,0,0,0,0,2h1a1,1,0,0,0,0-2Zm-9,8a1,1,0,0,0-1,1v1a1,1,0,0,0,2,0V20A1,1,0,0,0,12,19ZM18.36,17A1,1,0,0,0,17,18.36l.71.71a1,1,0,0,0,1.41,0,1,1,0,0,0,0-1.41ZM12,6.5A5.5,5.5,0,1,0,17.5,12,5.51,5.51,0,0,0,12,6.5Zm0,9A3.5,3.5,0,1,1,15.5,12,3.5,3.5,0,0,1,12,15.5Z"/>
        </svg>
        <span class="text-xs font-bold tracking-wide text-base-content/80 uppercase">Tema</span>
        <input type="checkbox" id="themeToggle" class="toggle toggle-sm toggle-primary border-transparent" />
        <svg class="w-4 h-4 fill-current text-base-content/60" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
            <path d="M21.64,13a1,1,0,0,0-1.05-.14,8.05,8.05,0,0,1-3.37.73A8.15,8.15,0,0,1,9.08,5.49a8.59,8.59,0,0,1,.25-2A1,1,0,0,0,8,2.36,10.14,10.14,0,1,0,22,14.05,1,1,0,0,0,21.64,13Zm-9.5,6.69A8.14,8.14,0,0,1,7.08,5.22v.27A10.15,10.15,0,0,0,17.22,15.63a9.79,9.79,0,0,0,2.1-.22A8.11,8.11,0,0,1,12.14,19.73Z"/>
        </svg>
    </label>
</div>

<!-- Center login card -->
<div class="card w-full max-w-sm mx-4 bg-base-100 border border-base-300 shadow-xl relative select-none">
    <div class="card-body px-8 py-10">
        <div class="flex flex-col items-center mb-4">
            <!-- Brand Logo -->
            <div class="sidebar-logo w-14 h-14 text-xl font-bold mb-3.5 flex items-center justify-center select-none cursor-default shadow-md">
                P
            </div>
            <h2 class="font-extrabold text-3xl tracking-tight text-base-content leading-none">PluSUAP</h2>
        </div>

        <div class="form-control">
            <a href="/auth/suap" id="loginBtn" class="btn btn-primary font-bold text-sm tracking-wide gap-2.5 w-full rounded-xl py-3.5 flex items-center justify-center border-none shadow-md">
                <span id="loginBtnDefault" class="flex items-center gap-2">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M15.75 9V5.25A2.25 2.25 0 0013.5 3h-6a2.25 2.25 0 00-2.25 2.25v13.5A2.25 2.25 0 007.5 21h6a2.25 2.25 0 002.25-2.25V15M12 9l-3 3m0 0l3 3m-3-3h12.75" />
                    </svg>
                    Entrar com SUAP
                </span>
                <span id="loginBtnLoading" class="hidden flex items-center gap-2">
                    <span class="loading loading-spinner loading-sm"></span>
                    Conectando ao SUAP...
                </span>
            </a>
        </div>

        <script>
            document.getElementById('loginBtn').addEventListener('click', function() {
                this.classList.add('btn-disabled', 'pointer-events-none');
                document.getElementById('loginBtnDefault').classList.add('hidden');
                document.getElementById('loginBtnLoading').classList.remove('hidden');
            });
        </script>

        <p class="text-[10px] text-center font-bold tracking-wide text-base-content/30 mt-8 leading-relaxed uppercase">
            Utilizamos o OAuth2 Oficial do SUAP.<br>Não armazenamos senhas ou credenciais.
        </p>
    </div>
</div>

<script>
    // Theme toggle matching base.html behavior
    const themeToggle = document.getElementById('themeToggle');
    const systemTheme = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'plus-dark' : 'plus';
    const currentTheme = localStorage.getItem('theme') || systemTheme;
    
    document.documentElement.setAttribute('data-theme', currentTheme);
    if (themeToggle) {
        themeToggle.checked = (currentTheme === 'plus-dark');
        themeToggle.addEventListener('change', function() {
            const nextTheme = themeToggle.checked ? 'plus-dark' : 'plus';
            document.documentElement.setAttribute('data-theme', nextTheme);
            localStorage.setItem('theme', nextTheme);
        });
    }
</script>
</body>
</html>
